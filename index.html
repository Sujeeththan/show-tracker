<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Show Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="./index.html">Show <b>Tracker</b></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="./index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="./add.html">Add Show</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="./login.html" id="log-in" class="btn btn-sm btn-outline-secondary me-2">Login</a>
                    <a href="./signup.html" id="sign-up" class="btn btn-sm btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Filters Section -->
    <div class="filter-container">
        <div class="container">
            <!-- Search -->
            <div class="d-flex justify-content-center mb-4">
                <input type="text" id="search-input" class="search-input" placeholder="Search shows...">
            </div>

            <!-- Alphabet Filters -->
            <div class="alphabet-filters" id="alphabet-filters mb-3">
                <a href="#" data-filter="all">All</a>
                <a href="#" data-filter="0-9">0-9</a>
                <!-- Dynamically generated or hardcoded A-Z -->
                <a href="#" data-filter="A">A</a> <a href="#" data-filter="B">B</a> 
                <a href="#" data-filter="C">C</a> <a href="#" data-filter="D">D</a>
                <a href="#" data-filter="E">E</a> <a href="#" data-filter="F">F</a>
                <a href="#" data-filter="G">G</a> <a href="#" data-filter="H">H</a>
                <a href="#" data-filter="I">I</a> <a href="#" data-filter="J">J</a>
                <a href="#" data-filter="K">K</a> <a href="#" data-filter="L">L</a>
                <a href="#" data-filter="M">M</a> <a href="#" data-filter="N">N</a>
                <a href="#" data-filter="O">O</a> <a href="#" data-filter="P">P</a>
                <a href="#" data-filter="Q">Q</a> <a href="#" data-filter="R">R</a>
                <a href="#" data-filter="S">S</a> <a href="#" data-filter="T">T</a>
                <a href="#" data-filter="U">U</a> <a href="#" data-filter="V">V</a>
                <a href="#" data-filter="W">W</a> <a href="#" data-filter="X">X</a>
                <a href="#" data-filter="Y">Y</a> <a href="#" data-filter="Z">Z</a>
            </div>

            <!-- Genre Filters -->
            <div class="genre-filters" id="genre-filters">
                <button class="genre-btn active" data-filter="all">All</button>
                <button class="genre-btn" data-filter="Action">Action</button>
                <button class="genre-btn" data-filter="Adventure">Adventure</button>
                <button class="genre-btn" data-filter="Animation">Animation</button>
                <button class="genre-btn" data-filter="Comedy">Comedy</button>
                <button class="genre-btn" data-filter="Crime">Crime</button>
                <button class="genre-btn" data-filter="Documentary">Documentary</button>
                <button class="genre-btn" data-filter="Drama">Drama</button>
                <button class="genre-btn" data-filter="Fantasy">Fantasy</button>
                <button class="genre-btn" data-filter="Horror">Horror</button>
                <button class="genre-btn" data-filter="Romance">Romance</button>
                <button class="genre-btn" data-filter="Sci-Fi">Sci-Fi</button>
                <button class="genre-btn" data-filter="Thriller">Thriller</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Trending Shows</h2>
        </div>

        <!-- Dynamic Grid -->
        <div class="shows-grid" id="shows-grid">
            <!-- Shows will be injected here by JS -->
        </div>

        <div id="no-results" class="text-center text-muted mt-5" style="display: none;">
            <h4>No shows found matching your criteria.</h4>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./js/app.js"></script>
    <script src="./js/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
