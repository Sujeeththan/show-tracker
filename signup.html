<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Show Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="./index.html">Show <b>Tracker</b></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="./login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2 class="form-title">Create Account</h2>
            <form id="signupForm">
                <div class="mb-3">
                    <label class="form-label text-muted">Full Name</label>
                    <input type="text" class="form-control" id="enter-Name" placeholder="Your Name">
                    <div class="error-msg" id="name-Error">Invalid name</div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Email Address</label>
                    <input type="email" class="form-control" id="enter-Email" placeholder="name@example.com">
                    <div class="error-msg" id="email-Error">Invalid email</div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" class="form-control" id="enter-Password" placeholder="8+ characters">
                    <div class="error-msg" id="password-Error">Password too weak</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>
                
                <div class="text-center text-muted">
                    Already have an account? <a href="./login.html" class="text-white text-decoration-none">Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
